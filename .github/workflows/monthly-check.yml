name: Checagem mensal do site

on:
  schedule:
    - cron: '0 9 1 * *' # todo dia 1, 09:00 UTC
  workflow_dispatch: {}

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checar links quebrados
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress https://devlucasferreira.netlify.app
          fail: true

      - name: Lighthouse (informativo, não bloqueia)
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: https://devlucasferreira.netlify.app
          uploadArtifacts: true

      - name: Abrir issue se algo quebrou
        if: failure() && steps.lychee.outcome == 'failure'
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          filename: .github/ISSUE_TEMPLATE/site-check-failed.md
